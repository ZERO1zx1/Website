<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Learning Intelligence Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.50.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>Programming Learning Platform</h1>
            </div>
            <div class="navbar-menu">
                <div id="user-info" class="user-info"></div>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content" class="container">
            <!-- Login Section -->
            <section id="login-section" class="auth-section">
                <div class="auth-card">
                    <h2>Login</h2>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                    <p>Don't have an account? <a href="#" id="show-register">Register</a></p>
                </div>
            </section>

            <!-- Register Section -->
            <section id="register-section" class="auth-section" style="display: none;">
                <div class="auth-card">
                    <h2>Register</h2>
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-name">Name</label>
                            <input type="text" id="reg-name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                    <p>Already have an account? <a href="#" id="show-login">Login</a></p>
                </div>
            </section>

            <!-- Dashboard Section -->
            <section id="dashboard-section" style="display: none;">
                <h2>Dashboard</h2>
                <div id="dashboard-content"></div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
