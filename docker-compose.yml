services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_ENV: production
      FRONTEND_ONLY: "false"
    ports:
      - "5000:5000"
    depends_on:
      - sandbox
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: codehaven-sandbox:local
    command: ["sleep", "infinity"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox_internal
    restart: unless-stopped

networks:
  sandbox_internal:
    internal: true
