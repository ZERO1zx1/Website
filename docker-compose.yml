services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_ENV: production
      FRONTEND_ONLY: "false"
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set}
      SUBMISSION_QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    networks:
      - app_network
      - sandbox_internal
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FRONTEND_ONLY: "false"
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set}
      SUBMISSION_QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "backend.worker"]
    depends_on:
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    networks:
      - app_network
      - sandbox_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sandbox_internal
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: codehaven-sandbox:local
    environment:
      FLASK_ENV: production
      SANDBOX_PORT: 8080
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set}
      SANDBOX_REQUIRE_TOKEN: "true"
    read_only: true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox_internal
    restart: unless-stopped

volumes:
  redis_data:

networks:
  app_network:
  sandbox_internal:
    internal: true
