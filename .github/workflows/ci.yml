name: Codehaven CI

on:
  push:
  pull_request:

concurrency:
  group: codehaven-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Python, frontend, and repository checks
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      FLASK_ENV: testing
      FRONTEND_ONLY: "false"
      SECRET_KEY: ci-test-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run canonical CI checks
        run: bash ci/check.sh

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  compose:
    name: Docker Compose contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Compose topology
        run: python scripts/validate_compose_contract.py

      - name: Validate Compose interpolation
        shell: bash
        run: |
          trap 'rm -f .env.ci' EXIT
          cat > .env.ci <<'EOF'
          FLASK_ENV=production
          SECRET_KEY=ci-compose-secret
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_KEY=ci-supabase-key
          SANDBOX_TOKEN=ci-sandbox-token
          SANDBOX_URL=http://sandbox:8080
          REDIS_URL=redis://redis:6379/0
          SUBMISSION_QUEUE_MODE=redis
          CORS_ORIGINS=https://example.com
          EOF
          docker compose --env-file .env.ci config --quiet

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [verify, compose]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build --tag codehaven:ci .
