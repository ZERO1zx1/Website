name: CodeCraft CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest ruff bandit pip-audit
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m bandit -q -r app.py backend sandbox
      - run: python -m pip_audit -r requirements.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --no-env-resolution --quiet
      - run: docker build --tag codecraft-academy:ci .
