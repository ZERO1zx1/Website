name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      FLASK_ENV: testing
      FRONTEND_ONLY: "true"
      SECRET_KEY: ci-test-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/static/js/app.js
          node --check frontend/static/js/adapters/api-adapter.js
          node --check frontend/static/js/monaco-editor.js
          node --check frontend/static/js/i18n/translations.js

      - name: Check repository hygiene
        run: |
          git diff --check
          if find . -path './.git' -prune -o -name '.env' -print | grep -q .; then
            echo 'A populated .env file must not be committed.'
            exit 1
          fi
          if git grep -nE 'change-this-in-production|sk-[A-Za-z0-9]{20,}|service_role' -- ':!.github/**' ':!scripts/validate_compose_contract.py' ':!.env.example'; then
            echo 'Potential committed secret or insecure production default detected.'
            exit 1
          fi

      - name: Validate Compose contract
        run: PYTHONPATH=. python scripts/validate_compose_contract.py

      - name: Validate Compose configuration
        run: |
          printf 'SECRET_KEY=ci-test-secret\nSUPABASE_URL=https://example.supabase.co\nSUPABASE_KEY=ci-test-key\nSANDBOX_TOKEN=ci-sandbox-token\n' > .env
          docker compose config
          rm -f .env
